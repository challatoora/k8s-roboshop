apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: db

spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
   
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db
    spec:
      containers:
      - name: mongodb
        image: challatoor/mongodb:1.0.0

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
        project: roboshop
        component: mongodb
        tier: db
  
spec:
  selector:
    #lables
      project: roboshop
      component: mongodb
      tier: db
  ports:
  - protocol: TCP
    port: 27017 # service port
    targetPort: 27017 # container port
