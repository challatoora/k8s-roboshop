apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: db

spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: db
   
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        tier: db
    spec:
      containers:
      - name: mysql
        image: challatoor/mysql:1.0.0

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
        project: roboshop
        component: mysql
        tier: db
  
spec:
  selector:
    #lables
      project: roboshop
      component: mysql
      tier: db
  ports:
  - protocol: TCP
    port: 3306 # service port
    targetPort: 3306 # container port
