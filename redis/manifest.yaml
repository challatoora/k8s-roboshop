apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: db

spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: db
   
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: db
    spec:
      containers:
      - name: redis
        image: redis:7.0

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
        project: roboshop
        component: redis
        tier: db
  
spec:
  selector:
    #lables
      project: roboshop
      component: redis
      tier: db
  ports:
  - protocol: TCP
    port: 6379 # service port
    targetPort: 6379 # container port
